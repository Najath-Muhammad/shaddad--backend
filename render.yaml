services:
  - type: web
    name: shaddad-api
    runtime: node
    region: singapore
    branch: dev
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: shaddad-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: shaddad-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION_DAYS
        value: "7"
      - key: CORS_ORIGIN
        value: "https://shaddad-frontend-admin.vercel.app,https://shaddad-admin.vercel.app"
      - key: LOG_LEVEL
        value: info

databases:
  - name: shaddad-db
    plan: free
    region: singapore

  - name: shaddad-redis
    plan: free
    region: singapore
